<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toret</title>
<style>
  :root { --carta:#F0E3BF; --ink:#16130F; --sole:#E9B33B; --rosso:#B7301F; }
  @media (prefers-color-scheme: dark) { :root { --carta:#16130F; --ink:#F0E3BF; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--carta); color:var(--ink);
    font:18px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif; display:flex; align-items:center; }
  main { width:100%; max-width:560px; margin:0 auto; padding:40px 24px; position:relative; }
  .sun { position:absolute; right:24px; top:8px; width:120px; height:120px; border-radius:50%; background:var(--sole); z-index:0; }
  .dot { position:absolute; right:12px; top:100px; width:26px; height:26px; border-radius:50%; background:var(--rosso); z-index:0; }
  h1 { position:relative; z-index:1; margin:0 0 24px; padding-left:18px; border-left:4px solid var(--ink);
    font:900 clamp(64px,18vw,104px)/.9 "Avenir Next","Helvetica Neue",Arial,sans-serif; letter-spacing:-.02em; text-transform:uppercase; }
  p { position:relative; z-index:1; margin:0 0 28px; max-width:30ch; }
  nav { position:relative; z-index:1; display:flex; gap:12px; flex-wrap:wrap; }
  a { display:inline-block; padding:14px 20px; background:var(--ink); color:var(--carta); text-decoration:none; font-weight:700; }
  a:focus-visible { outline:3px solid var(--rosso); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <span class="sun" aria-hidden="true"></span><span class="dot" aria-hidden="true"></span>
  <h1>Toret</h1>
  <p lang="pt-BR">Encontre as fontes de água de Turim. · Find Turin's drinking fountains. · Trova le fontanelle di Torino.</p>
  <nav>
    <a href="/privacy/">Privacidade · Privacy</a>
    <a href="/support/">Suporte · Support</a>
  </nav>
</main>
</body>
</html>
