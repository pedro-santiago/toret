AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Toret community API: Go Lambda behind an API Gateway HTTP API on a regional
  custom domain, one DynamoDB table, and a scheduled ingest Lambda for the
  weather and SMAT caches. Nothing here is account specific; see README.md.

Parameters:
  DomainName:
    Type: String
    Default: torino.deepdive.dev.br
    Description: Public host name of the API.
  HostedZoneId:
    Type: String
    Default: Z04396242858F2PQ4XPD0
    Description: Route 53 hosted zone that contains DomainName (an id, not a secret).
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[A-Za-z0-9-]+$"
    ConstraintDescription: An ISSUED ACM certificate ARN in this region that covers DomainName. Passed at deploy time, never committed.
  TableName:
    Type: String
    Default: ""
    Description: >-
      Physical name of the DynamoDB table. Empty (the default) lets CloudFormation
      generate one, which is what lets the stack be deleted and created again, or
      the table replaced, while the old table is kept: a fixed name would make both fail.
  PepperParameterName:
    Type: String
    Default: /toret/pepper
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"
    Description: SSM SecureString holding the HMAC pepper. Created once by `make pepper`, never rotated, not in this template.
  SmatEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: >-
      Turns on the SMAT works-notices ingest and the notices in /v1/conditions.
      SMAT publishes no licence for this data, so it is off unless the owner decides.
  ThrottleRate:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >-
      Steady requests per second per route for the read routes (stage default
      route settings). Throttling is per route and shared by every caller, so it
      bounds cost and a runaway client, not a determined flood (see README).
  ThrottleBurst:
    Type: Number
    Default: 40
    MinValue: 1
  WriteThrottleRate:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Steady requests per second for each write route (POST report, DELETE report, POST flag).
  WriteThrottleBurst:
    Type: Number
    Default: 5
    MinValue: 1
  LightThrottleRate:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Steady requests per second for /v1/health and /v1/conditions (tiny, cacheable answers).
  LightThrottleBurst:
    Type: Number
    Default: 10
    MinValue: 1
  GlobalWritesPerHour:
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 270
    Description: >-
      Circuit breaker: writes of every caller together per clock hour; beyond it
      writes answer 429 (reason global) until the next hour. The upper bound keeps
      this times the 37 hourly windows of a 36 h summary read under its 10000-report read cap.
  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Optional. An address to receive the DynamoDB consumption alarms (SNS asks it
      to confirm by e-mail). Empty creates the alarms without a notification. Passed
      at deploy time, never committed.
  WriteUnitsAlarmPerHour:
    Type: Number
    Default: 10000
    MinValue: 1
    Description: Alarm when the table consumes more write capacity units than this in an hour (normal use is a few hundred).
  ReadUnitsAlarmPerHour:
    Type: Number
    Default: 500000
    MinValue: 1
    Description: Alarm when the table consumes more read capacity units than this in an hour.
  ApiReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: -1
    Description: >-
      Reserved concurrent executions of the API function. -1 leaves it unreserved
      (needed when the account limit is so low that reserving would leave fewer
      than 10 unreserved executions). 0 would stop the function.
  IngestReservedConcurrency:
    Type: Number
    Default: 1
    MinValue: -1
    Description: Same for the ingest function. 1 means two runs can never overlap.

Conditions:
  NamedTable: !Not [!Equals [!Ref TableName, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  ReserveApi: !Not [!Equals [!Ref ApiReservedConcurrency, -1]]
  ReserveIngest: !Not [!Equals [!Ref IngestReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Handler: bootstrap
    CodeUri: .
    MemorySize: 256
    Tracing: Disabled

Resources:
  # ---------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    # Kept when the stack is deleted or the table replaced, and protected against
    # a stray delete-table. The physical name is generated by default, so a kept
    # table never blocks a new stack, and a failed first create (rolled back with
    # the table retained, since deletion protection would refuse to delete it) leaves
    # only an empty table behind.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [NamedTable, !Ref TableName, !Ref "AWS::NoValue"]
      DeletionProtectionEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------- logs
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ingest"
      RetentionInDays: 14

  # ---------------------------------------------------------------- roles
  # Explicit roles: SAM would otherwise attach AWSLambdaBasicExecutionRole,
  # which allows creating log groups anywhere in the account.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: toret-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Table
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub "${Table.Arn}/index/*"
              # The pepper is a SecureString under the AWS managed key aws/ssm,
              # whose key policy already lets principals that may call SSM
              # decrypt it; no kms permission is granted here.
              - Sid: Pepper
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PepperParameterName}"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                # The group ARN already ends in ":*", which covers its streams.
                Resource: !GetAtt ApiLogGroup.Arn

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: toret-ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Only the two cache items (partition CONDITIONS), never a report.
              - Sid: ConditionsCache
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [CONDITIONS]
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IngestLogGroup.Arn

  # ---------------------------------------------------------------- functions
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Toret community API (HTTP API payload 2.0)
      Role: !GetAtt ApiRole.Arn
      Timeout: 10
      ReservedConcurrentExecutions: !If [ReserveApi, !Ref ApiReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PEPPER_PARAM: !Ref PepperParameterName
          SMAT_ENABLED: !Ref SmatEnabled
          GLOBAL_WRITES_PER_HOUR: !Ref GlobalWritesPerHour
      Events:
        Health: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /v1/health, Method: GET } }
        ListReports: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /v1/reports, Method: GET } }
        SaveReport: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /v1/reports, Method: POST } }
        FountainReports: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/v1/fountains/{id}/reports", Method: GET } }
        Summaries: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /v1/summaries, Method: GET } }
        Conditions: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /v1/conditions, Method: GET } }
        DeleteReport: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/v1/reports/{id}", Method: DELETE } }
        FlagReport: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/v1/reports/{id}/flag", Method: POST } }

  IngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Toret scheduled ingest (weather every 15 minutes, SMAT hourly when enabled)
      Role: !GetAtt IngestRole.Arn
      Timeout: 60
      ReservedConcurrentExecutions: !If [ReserveIngest, !Ref IngestReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 0 # the next schedule is the retry; Open-Meteo asks for 15 minutes between calls
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          SMAT_ENABLED: !Ref SmatEnabled
      Events:
        Weather:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"job":"weather"}'
        Smat:
          # Always scheduled; the function does nothing unless SMAT_ENABLED is "true".
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Input: '{"job":"smat"}'

  # ---------------------------------------------------------------- HTTP API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Toret community API
      # Stage $default (SAM's default when no StageName is given), throttled.
      # Throttling is per route and shared by all callers: the write routes get
      # a low ceiling of their own so a write flood cannot reach the table at
      # the read rate, and cannot use up the read routes' budget.
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRate
        ThrottlingBurstLimit: !Ref ThrottleBurst
      RouteSettings:
        "POST /v1/reports":
          ThrottlingRateLimit: !Ref WriteThrottleRate
          ThrottlingBurstLimit: !Ref WriteThrottleBurst
        "DELETE /v1/reports/{id}":
          ThrottlingRateLimit: !Ref WriteThrottleRate
          ThrottlingBurstLimit: !Ref WriteThrottleBurst
        "POST /v1/reports/{id}/flag":
          ThrottlingRateLimit: !Ref WriteThrottleRate
          ThrottlingBurstLimit: !Ref WriteThrottleBurst
        "GET /v1/health":
          ThrottlingRateLimit: !Ref LightThrottleRate
          ThrottlingBurstLimit: !Ref LightThrottleBurst
        "GET /v1/conditions":
          ThrottlingRateLimit: !Ref LightThrottleRate
          ThrottlingBurstLimit: !Ref LightThrottleBurst
      # Only the custom domain reaches the API, so the source IP and Host
      # that the code sees are the real ones.
      DisableExecuteApiEndpoint: true

  # ---------------------------------------------------------------- domain
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  # Without this mapping every route answers 403: the HTTP API rejects hosts it
  # does not know.
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: HttpApiApiGatewayDefaultStage
    Properties:
      DomainName: !Ref CustomDomain
      ApiId: !Ref HttpApi
      Stage: $default

  # Fails if the name already has a record, instead of replacing it.
  DnsAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------- alarms
  # The write cost is bounded by the code (global ceiling) and the stage; these
  # tell the owner when something outside the expected range is spending anyway.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      DisplayName: Toret table alarms
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlarmEmail }

  WriteUnitsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The Toret table consumed an unusual amount of write capacity in an hour (a write flood?).
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - { Name: TableName, Value: !Ref Table }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref WriteUnitsAlarmPerHour
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

  ReadUnitsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The Toret table consumed an unusual amount of read capacity in an hour (a read flood?).
      Namespace: AWS/DynamoDB
      MetricName: ConsumedReadCapacityUnits
      Dimensions:
        - { Name: TableName, Value: !Ref Table }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref ReadUnitsAlarmPerHour
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

Outputs:
  Url:
    Description: Public base URL
    Value: !Sub "https://${DomainName}"
  TableName:
    Value: !Ref Table
  ApiLogGroup:
    Value: !Ref ApiLogGroup
  IngestLogGroup:
    Value: !Ref IngestLogGroup
