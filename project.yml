name: Toret
options:
  bundleIdPrefix: br.tec.nuance
  # English is the fallback: a device set to German or Spanish gets English, not
  # the Portuguese the source strings happen to be written in. See docs/localization.md.
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # String catalogs: the compiler writes every localizable literal it sees to a
    # .stringsdata file, and tools/l10n.py sync folds those into the catalog.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Toret:
    type: application
    platform: iOS
    sources:
      - path: Toret
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Toret/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.tec.nuance.toret
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Toret
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Toret/Toret.entitlements
    info:
      path: Toret/Info.plist
      properties:
        CFBundleDisplayName: Toret
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The values below are the English fallback; pt-BR and Italian live in
        # Toret/Resources/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: >-
          Toret uses your location to point the needle at the nearest fountain and
          work out the walking distance.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          With location always on, the Toret compass stays visible on the Lock
          Screen and in the widget, and you get a heads-up when you pass a fountain.
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: br.tec.nuance.toret
            CFBundleURLSchemes:
              - toret
        UIAppFonts:
          - Archivo.ttf
          - LeagueSpartan.ttf
        CFBundleLocalizations:
          - en
          - it
          - pt-BR
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: ToretWidgetsExtension

  ToretWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ToretWidgets
        excludes:
          - PrivacyInfo.xcprivacy
      - path: ToretWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      - path: Toret/Resources/Fonts
        buildPhase: resources
        excludes:
          - "*.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.tec.nuance.toret.widgets
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: ToretWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Toret
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ToretWidgets/ToretWidgets.entitlements
    info:
      path: ToretWidgets/Info.plist
      properties:
        CFBundleDisplayName: Toret
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Archivo.ttf
          - LeagueSpartan.ttf
        NSWidgetWantsLocation: true
        CFBundleLocalizations:
          - en
          - it
          - pt-BR
        CFBundleDevelopmentRegion: en
        # English fallback; the translations are in ToretWidgets/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: >-
          Toret uses your location to show, in the widget, the distance to the
          nearest fountain.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ToretTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ToretTests
    dependencies:
      - target: Toret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.tec.nuance.toret.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Toret:
    build:
      targets:
        Toret: all
    run:
      config: Debug
    test:
      config: Debug
      # The unit tests assert the app's own wording, so they run in the catalogue's
      # source language rather than in whatever language the simulator is set to.
      # LocalizationTests covers the other languages explicitly.
      language: pt-BR
      region: BR
      targets:
        - ToretTests
    archive:
      config: Release
